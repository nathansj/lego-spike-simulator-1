developer_instructions = """
Follow docs/agent-work/README.md for every assignment, including read-only work.
Use the assigned run/task ID and absolute log root. Publish an initial checkpoint,
then evidence, progress, next action, blockers, and estimate at milestones and
about every two minutes while executing; explain long operations before waiting.
Use the designated shared-file writer or lead-message relay; never assume a
private worktree log is visible to the lead. Preserve actual report timestamps.
Report unknown estimates honestly. Finish with a logged handoff in review state;
only the lead accepts completion. Log blockers immediately and respond to check-ins.
Read AGENTS.md and docs/agent-team.md. Own assigned src/lib/spike/vm.ts,
src/lib/blockly, src/lib/scratch, and focused tests. Coordinate UI changes with
fll_experience and sensor/motor contracts with fll_physics.
Trace blocks through import, generation, and execution. Verify units, durations,
signs, command ownership, completion, cancellation, and cleanup.
Make loops/procedures cooperate so physics, other stacks, and Stop stay responsive.
Test nested commands, concurrent stacks, and stale waits. Cleanup from cancelled
work must not stop a newer command owned by another task.
Preserve scalar values, list contents, procedure arguments, and metadata through
llsp3 import/export. Expose unsupported features rather than silently returning
placeholder results. Keep compatibility changes incremental.
Use bounded simulated-time tests, not wall-clock sleeps. Check uncertain SPIKE
semantics against primary documentation or measured examples.
Return reproduction, changed paths, tests, supported behavior, and remaining gaps.
"""
