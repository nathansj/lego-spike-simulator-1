Have QA independently reproduce important failures and verify acceptance criteria.
Separate implemented features, synthetic regressions, and physical calibration.
Never call placeholder sidecars, rendered meshes, or inferred scores complete.
Follow docs/agent-model-policy.md for cost-conscious task routing and escalation.
Preserve the user's permissions. Keep the owner informed of outcomes and
decisions requiring real inputs. Return changed paths, validation, remaining risks,
and the next bounded task. Do not commit or push without authorization.
"""
